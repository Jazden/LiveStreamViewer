<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galveston Matrix Console</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background-color: #090d16; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; }
        .view-panel { width: 100%; max-width: 1400px; margin: auto; }
        .hidden { display: none !important; }
        .controls { display: flex; gap: 10px; }
        .btn { background: #131a26; border: 1px solid #222; color: #fff; padding: 10px 15px; cursor: pointer; border-radius: 6px; }
        .btn.active { border-color: #38bdf8; color: #38bdf8; }
        
        /* Fixed Clock */
        #clock { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; border: 1px solid #38bdf8; font-family: monospace; font-size: 1.2rem; color: #38bdf8; z-index: 1000; }
        
        /* Grid and Ratio Fix */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-container { width: 100%; }
        .video-js { width: 100% !important; height: auto !important; aspect-ratio: 16/9 !important; }
    </style>
</head>
<body>

    <div id="clock">--:--:--</div>

    <header>
        <h1>Galveston Matrix</h1>
        <div class="controls">
            <button class="btn" onclick="location.reload()">Refresh All</button>
            <button class="btn" id="cycle-btn" onclick="toggleCycle()">Auto-Cycle: OFF</button>
            <button class="btn" onclick="toggleFS()">Fullscreen</button>
            <button class="btn active" id="btn-tv" onclick="show('tv')">Cinema</button>
            <button class="btn" id="btn-grid" onclick="show('grid')">Multi-View</button>
            <button class="btn" id="btn-weather" onclick="show('weather')">Weather</button>
        </div>
    </header>

    <div id="panel-tv" class="view-panel">
        <video id="tv-player" class="video-js" controls autoplay muted></video>
    </div>

    <div id="panel-grid" class="view-panel hidden">
        <div class="grid" id="grid-container"></div>
    </div>

    <div id="panel-weather" class="view-panel hidden">
        <iframe src="https://wttr.in/Galveston?m&2&F&transparency=150" style="width:100%; height:500px; border:none;"></iframe>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>
    <script>
        const channels = [
            { name: "Skycam North", url: "https://use01-smr05-relay.ozolio.com/hls-live/_definst_/relay01.fjfebpl.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" },
            { name: "Skycam South", url: "https://use01-smr05-relay.ozolio.com/hls-live/_definst_/relay01.yykibrj.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" },
            { name: "Seawall (Beach View)", url: "https://usw01-smr05-relay.ozolio.com/hls-live/_definst_/relay01.ranl5w.fd0.sm1.av1.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" },
            { name: "Seawall 28th St", url: "https://usw01-smr05-relay.ozolio.com/hls-live/_definst_/relay01.ranl5w.fd0.sm1.av1.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" },
            { name: "Downtown Square", url: "https://usw01-smr05-relay.ozolio.com/hls-live/_definst_/relay01.qlyfdf9.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" },
            { name: "Harbor House", url: "https://usw01-smr04-relay.ozolio.com/hls-live/_definst_/relay01.zcsqd9k.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" },
            { name: "61st & Seawall", url: "https://usw01-smr05-relay.ozolio.com/hls-live/_definst_/relay01.qghrexk.fd0.sm1.av2.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" },
            { name: "East Beach Overlook", url: "https://usw01-smr04-relay.ozolio.com/hls-live/_definst_/relay01.odojbkb.fd0.sm1.av1.mt0.at0.as0.dv0.sh2.rt31821.rc0.edge.basic.stream/playlist.m3u8" }
        ];

        function show(m) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById('panel-'+m).classList.remove('hidden');
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+m).classList.add('active');
            if(m === 'grid') buildGrid();
        }

        function buildGrid() {
            const cont = document.getElementById('grid-container');
            cont.innerHTML = '';
            channels.forEach((c, i) => {
                cont.innerHTML += `<div class="video-container"><h4>${c.name}</h4><video id="v${i}" class="video-js" controls autoplay muted><source src="${c.url}" type="application/x-mpegURL"></video></div>`;
            });
            channels.forEach((c, i) => videojs('v'+i));
        }

        let cycle = null;
        function toggleCycle() {
            if(cycle) { clearInterval(cycle); cycle = null; document.getElementById('cycle-btn').innerText = "Auto-Cycle: OFF"; }
            else { 
                let i = 0;
                cycle = setInterval(() => {
                    const p = videojs('tv-player');
                    p.src({src: channels[i].url, type: 'application/x-mpegURL'});
                    p.play();
                    i = (i + 1) % channels.length;
                }, 60000); 
                document.getElementById('cycle-btn').innerText = "Auto-Cycle: ON";
            }
        }

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
        function toggleFS() { !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen(); }
        videojs('tv-player').src({ src: channels[0].url, type: 'application/x-mpegURL' });
    </script>
</body>
</html>
